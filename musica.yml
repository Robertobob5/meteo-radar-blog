# La musica dei video della fotocamera (v76): sei brani liberi (CC0, dominio
# pubblico) presi da OpenGameArt, tagliati a 60 secondi con le dissolvenze e
# il volume pareggiato, salvati in MP3 leggero nella cartella musica/ del ramo
# main, con l'elenco in musica/musica.json e i crediti in musica/CREDITI.md.
# L'app legge l'elenco e scarica solo il brano scelto (~700 KB) per metterlo
# sotto la voce nel video da condividere.
#
# NON è in calendario: si lancia a mano, una volta (Actions → "Musica dei
# video" → Run workflow). Si rilancia solo se un giorno si cambiano i brani
# in musica.mjs. Con la spunta "rifai" riscarica e ritaglia anche quelli che
# ci sono già. Niente chiavi, niente segreti: sono file pubblici.
name: Musica dei video

on:
  workflow_dispatch:
    inputs:
      rifai:
        description: 'Riscarica e ritaglia anche i brani già presenti'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: musica
  cancel-in-progress: false

jobs:
  musica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepara ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          test -x "$(command -v ffmpeg)" || { echo "ffmpeg non trovato"; exit 1; }
          ffmpeg -version 2>&1 | head -1

      - name: Scarica e taglia i brani
        env:
          RIFAI: ${{ github.event.inputs.rifai == 'true' && '1' || '' }}
        run: node musica.mjs

      - name: Pubblica la cartella musica
        run: |
          if [ -z "$(git status --porcelain musica)" ]; then
            echo "Niente di nuovo: la musica resta com'è."
            exit 0
          fi
          git config user.name  "Meteo Radar"
          git config user.email "musica@meteoradar.local"
          git add -A musica
          git commit -m "Musica dei video · $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            if git push; then echo "pubblicato"; exit 0; fi
            echo "push fallito, riprovo fra 20 secondi ($i)"; sleep 20
            git pull --rebase || true
          done
          exit 1
