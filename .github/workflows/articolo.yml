# L'articolo del giorno, scritto da solo alle 8 del mattino (ora italiana).
#
# GitHub ragiona in UTC e l'Italia cambia ora due volte l'anno, quindi si
# tenta più volte: la prima che riesce pubblica, le altre escono in dieci
# secondi perché trovano l'articolo di oggi già fatto, e non spendono niente.
#
# PERCHÉ NON AL MINUTO ZERO. La documentazione di GitHub dice che gli avvii
# programmati "possono essere ritardati nei periodi di carico" e che fra i
# periodi di carico c'è "l'inizio di ogni ora". Un avvio troppo in ritardo
# non viene recuperato: si perde. Ai minuti 13 e 43 si sta fuori dalla calca.
#
# Si può sempre lanciare a mano dalla scheda "Actions".
name: Articolo del giorno

on:
  schedule:
    # DODICI tentativi, ogni mezz'ora dalle 08:13 alle 13:43 italiane.
    # Non è accanimento: GitHub non garantisce gli avvii programmati e ne
    # lascia cadere parecchi senza recuperarli. Misurato su questo blog:
    # in tre giorni ne sono partiti due, e quei due con 24 e 47 minuti di
    # ritardo. Con dodici occasioni basta che ne vada in porto una.
    # Costano zero: la prima che riesce pubblica, tutte le altre trovano
    # l'articolo di oggi già fatto ed escono in dieci secondi senza
    # chiamare nessuno e senza spendere un centesimo.
    - cron: '13,43 6-11 * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: "Scrivi l'articolo anche se quello di oggi c'è già"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: articolo-del-giorno
  cancel-in-progress: false

jobs:
  scrivi:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Scrivi l'articolo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELLO_TESTO: ${{ vars.MODELLO_TESTO || 'gpt-5.6-terra' }}
          MODELLO_IMMAGINI: ${{ vars.MODELLO_IMMAGINI || 'gpt-image-2' }}
          MAX_IMMAGINI_INTERNE: ${{ vars.MAX_IMMAGINI_INTERNE || '2' }}
          FUSO: Europe/Rome
          SITO: https://robertobob5.github.io/meteo-radar-blog/
          APK: ${{ vars.APK || 'https://drive.google.com/drive/folders/12S14HNl9zudUCuLCyeIYXtYYD1Sf6I07' }}
        run: node genera.mjs ${{ inputs.forza && '--forza' || '' }}

      - name: Pubblica
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Niente di nuovo: oggi il blog resta com'è."
            exit 0
          fi
          git config user.name  "Meteo Radar"
          git config user.email "blog@meteoradar.local"
          git add -A articoli immagini p indice.json index.html .nojekyll 2>/dev/null || git add -A
          git commit -m "Articolo del $(TZ=Europe/Rome date +%d/%m/%Y)"
          git push
