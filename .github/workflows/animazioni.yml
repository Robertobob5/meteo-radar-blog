name: Animazioni delle previsioni

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: 'Rifai le animazioni anche se sono fresche'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: filmati
  cancel-in-progress: false

jobs:
  animazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepara ffmpeg e il disegno (canvas)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          test -x "$(command -v ffmpeg)" || { echo "ffmpeg non trovato"; exit 1; }
          ffmpeg -version 2>&1 | head -1
          npm install --no-save --no-audit --no-fund canvas@3

      - name: Prendi quello che c'è già sul ramo filmati
        run: |
          mkdir -p ramo
          if git fetch --depth 1 origin filmati 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C ramo
            echo "ramo filmati letto: $(ls ramo | tr '\n' ' ')"
          else
            echo "ramo filmati ancora da creare"
          fi

      - name: Disegna i filmati (solo se quelli di prima hanno più di 5 ore e mezza)
        id: disegna
        env:
          FUSO: Europe/Rome
          RAMO_DIR: ramo
          MIN_ORE: '5.5'
          FORZA: ${{ github.event.inputs.forza == 'true' && '1' || '' }}
        run: node animazioni.mjs

      - name: Pubblica sul ramo filmati
        if: steps.disegna.outputs.nuovo == '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ramo
          rm -rf .git
          git init -q
          git checkout -q --orphan filmati
          git config user.name  "Meteo Radar"
          git config user.email "video@meteoradar.local"
          git add -A
          git commit -q -m "Animazioni · $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            if git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" filmati; then
              echo "pubblicato"; exit 0
            fi
            echo "push fallito, riprovo fra 20 secondi ($i)"; sleep 20
          done
          exit 1
