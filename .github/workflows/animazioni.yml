# Le "Previsioni in video": quattro volte al giorno si prende la griglia
# dell'Italia dal modello di Open-Meteo, si disegnano i fotogrammi sopra la
# mappa e con ffmpeg escono sei filmati brevi (temperature, pioggia e
# temporali, vento del weekend, neve, nuvole, mare) con locandina ed elenco
# in previsioni.json, pubblicati sul ramo "filmati" accanto a video.json.
#
# v73.4 — e UNA VOLTA AL GIORNO esce anche il filmato del giorno su
# Atlantico, Europa e Nord Africa ("Da dove arriva il tempo"), con la
# cornice da telegiornale e la voce dentro, in previsioni/mondo.mp4. Ha il
# suo orologio (MIN_ORE_MONDO, 20 ore): la sveglia delle 7 di cron-job.org
# lo trova vecchio e lo rifà, tutte le altre sveglie lo trovano fresco e non
# lo toccano. Quello di oggi prende il posto di quello di ieri: il ramo
# viene rifatto da capo a ogni pubblicazione, quindi il vecchio sparisce da
# solo. La voce usa la stessa chiave del blog (OPENAI_API_KEY): se manca, il
# filmato si fa lo stesso, muto, e il racconto resta scritto nell'app.
#
# In calendario OGNI MEZZ'ORA (minuti 17 e 47) perché GitHub lascia cadere
# molti avvii programmati: ma il lavoro vero si fa solo se le animazioni
# hanno più di 5 ore e mezza (MIN_ORE), cioè circa quattro volte al giorno.
# Tutti gli altri avvii trovano tutto fresco ed escono in pochi secondi
# senza chiamare Open-Meteo e senza pubblicare niente. "Run workflow" con
# la spunta "forza" le rifà comunque.
#
# Il lavoro lo fa GitHub una volta sola per tutti: il telefono scarica solo
# i filmati (qualche centinaio di KB l'uno). Costo Open-Meteo: circa 1.250
# chiamate per giro, entro il limite gratuito. Se un servizio non risponde,
# quel filmato resta quello del giro prima e gli altri si fanno lo stesso.
#
# Stesso gruppo di concorrenza di video.yml ("filmati"): i due lavori non
# si sovrappongono mai, e il ramo viene rifatto da capo ogni volta con
# dentro sia i video di attualità sia le animazioni.
name: Animazioni delle previsioni

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: 'Rifai le animazioni anche se sono fresche'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: filmati
  cancel-in-progress: false

jobs:
  animazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepara ffmpeg e il disegno (canvas)
        run: |
          # sulle macchine di GitHub ffmpeg non è più preinstallato: si mette con apt (mezzo minuto)
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          test -x "$(command -v ffmpeg)" || { echo "ffmpeg non trovato"; exit 1; }
          ffmpeg -version 2>&1 | head -1
          npm install --no-save --no-audit --no-fund canvas@3

      - name: Prendi quello che c'è già sul ramo filmati
        run: |
          mkdir -p ramo
          if git fetch --depth 1 origin filmati 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C ramo
            echo "ramo filmati letto: $(ls ramo | tr '\n' ' ')"
          else
            echo "ramo filmati ancora da creare"
          fi

      - name: Disegna i filmati (i sei dell'Italia dopo 5 ore e mezza, quello del giorno dopo 20)
        id: disegna
        env:
          FUSO: Europe/Rome
          RAMO_DIR: ramo
          MIN_ORE: '5.5'
          MIN_ORE_MONDO: '20'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORZA: ${{ github.event.inputs.forza == 'true' && '1' || '' }}
        run: node animazioni.mjs

      - name: Pubblica sul ramo filmati
        if: steps.disegna.outputs.nuovo == '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ramo
          rm -rf .git
          git init -q
          git checkout -q --orphan filmati
          git config user.name  "Meteo Radar"
          git config user.email "video@meteoradar.local"
          git add -A
          git commit -q -m "Animazioni · $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            if git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" filmati; then
              echo "pubblicato"; exit 0
            fi
            echo "push fallito, riprovo fra 20 secondi ($i)"; sleep 20
          done
          exit 1
