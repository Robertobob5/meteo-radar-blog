name: Video di attualità

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filmati
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prendi quello che c'è già sul ramo filmati
        run: |
          mkdir -p ramo
          if git fetch --depth 1 origin filmati 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C ramo
            echo "ramo filmati letto: $(ls ramo | tr '\n' ' ')"
          else
            echo "ramo filmati ancora da creare"
          fi

      - name: Cerca i video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELLO_TESTO: ${{ vars.MODELLO_TESTO || 'gpt-5.6-terra' }}
          FUSO: Europe/Rome
          RAMO_DIR: ramo
        run: node video.mjs

      - name: Pubblica sul ramo filmati
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ramo
          rm -rf .git
          git init -q
          git checkout -q --orphan filmati
          git config user.name  "Meteo Radar"
          git config user.email "video@meteoradar.local"
          git add -A
          git commit -q -m "Video di attualità · $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            if git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" filmati; then
              echo "pubblicato"; exit 0
            fi
            echo "push fallito, riprovo fra 20 secondi ($i)"; sleep 20
          done
          exit 1
